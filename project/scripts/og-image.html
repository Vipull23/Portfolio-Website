<!doctype html><html><head><meta charset="utf-8"><style>
<!-- Source for public/og-image.png (1200x630). Open in Chrome at 1200x630 and screenshot, or ask Claude to re-render it. -->
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#141414;font-family:"Segoe UI",system-ui,sans-serif;color:#fff;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse at 78% 30%,rgba(229,9,20,.45),transparent 55%),radial-gradient(ellipse at 5% 100%,rgba(229,9,20,.15),transparent 50%)}
.vs{position:absolute;right:-40px;top:20px;font-size:430px;font-weight:900;letter-spacing:-20px;line-height:1;color:transparent;-webkit-text-stroke:3px rgba(255,255,255,.09)}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,#141414 30%,rgba(20,20,20,.6) 60%,transparent)}
.content{position:absolute;left:72px;top:70px;right:72px}
.kicker{display:flex;align-items:center;gap:12px;font-size:22px;letter-spacing:.35em;color:#9b9b9b;font-weight:600}
.kicker b{color:#E50914;font-size:44px;font-weight:900;letter-spacing:0}
h1{font-size:104px;font-weight:900;letter-spacing:-3px;line-height:.95;margin:14px 0 18px;text-transform:uppercase}
.meta{display:flex;gap:16px;align-items:center;font-size:26px}
.match{color:#22c55e;font-weight:700}
.badge{border:2px solid rgba(255,255,255,.45);border-radius:6px;padding:1px 10px;font-size:20px;color:#cfcfcf}
.role{font-size:32px;font-weight:600;margin-top:22px}
.tag{font-size:24px;color:#cfcfcf;margin-top:8px;max-width:640px;line-height:1.35}
.row{position:absolute;left:72px;bottom:48px;display:flex;gap:18px}
.poster{width:190px;height:107px;border-radius:8px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.poster span{position:absolute;left:12px;bottom:8px;font-weight:900;font-size:19px;line-height:.95;text-transform:uppercase}
.poster i{position:absolute;left:10px;top:4px;color:#E50914;font-style:normal;font-weight:900;font-size:20px}
.poster:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.65),transparent 70%)}
.poster span,.poster i{z-index:1}
.bar{position:absolute;left:0;right:0;bottom:0;height:8px;background:#E50914}
</style></head><body>
<div class="glow"></div><div class="vs">VS</div><div class="fade"></div>
<div class="content">
  <div class="kicker"><b>V</b>PROFILE</div>
  <h1>Vipul Sharma</h1>
  <div class="meta"><span class="match">98% Match</span><span>Since 2025</span><span class="badge">Java 17</span><span class="badge">Spring Boot 3</span><span class="badge">Kafka</span></div>
  <div class="role">Java Backend Developer</div>
  <div class="tag">Microservices, event-driven pipelines and secure REST APIs.</div>
</div>
<div class="row">
  <div class="poster" style="background:linear-gradient(135deg,#7a1212,#1a0505)"><i>V</i><span>Digital<br>E-Wallet</span></div>
  <div class="poster" style="background:linear-gradient(135deg,#123a73,#050a1a)"><i>V</i><span>MovieNow</span></div>
  <div class="poster" style="background:linear-gradient(135deg,#0f5a36,#04140c)"><i>V</i><span>Digital<br>Library</span></div>
</div>
<div class="bar"></div>
</body></html>
