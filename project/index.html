<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141414" />
    <title>Vipul Sharma | Java Backend Developer</title>
    <meta
      name="description"
      content="Portfolio of Vipul Sharma, a Java Backend Developer building scalable microservices with Spring Boot, Kafka, Redis and MySQL."
    />

    <!-- Link previews (LinkedIn, WhatsApp, X, Slack).
         After deploying, replace "/og-image.png" with the full URL, e.g. https://your-domain.com/og-image.png,
         and add <meta property="og:url" content="https://your-domain.com/" />: LinkedIn ignores relative image paths. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vipul Sharma | Java Backend Developer" />
    <meta
      property="og:description"
      content="Spring Boot microservices, event-driven systems with Kafka, and secure REST APIs. Explore projects, skills and resume."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vipul Sharma, Java Backend Developer, Netflix-style portfolio card" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body class="bg-[#141414]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
